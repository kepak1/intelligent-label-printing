<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="/printers.js"></script>
<script src="/shim.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: var(--w); height: var(--h); overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    color: #111827;
    background: radial-gradient(1200px 700px at 85% 15%, #dfe8ff 0%, rgba(223,232,255,0) 60%),
                linear-gradient(160deg, #f7f9ff 0%, #eef2fb 100%);
    -webkit-font-smoothing: antialiased;
  }
  .slide { position: relative; width: 100%; height: 100%; padding: 64px 72px; }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 650; font-size: 20px; color: #1f2a44; }
  .brand img { width: 40px; height: 40px; }
  h1 { font-size: 50px; line-height: 1.08; letter-spacing: -0.02em; font-weight: 750; margin-top: 28px; }
  h1 em { font-style: normal; color: #2b59ff; }
  .sub { font-size: 21px; line-height: 1.45; color: #4b5563; margin-top: 18px; }
  .badges { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
  .badge { display: inline-flex; align-items: center; gap: 8px; background: #fff; border: 1px solid #dfe5f2; border-radius: 999px; padding: 9px 16px; font-size: 16px; font-weight: 600; color: #1f2a44; box-shadow: 0 1px 2px rgba(16,24,40,.05); }
  .badge.hi { background: #2b59ff; border-color: #2b59ff; color: #fff; }
  .badge b { color: #16a34a; }
  .paper { background: #fff; box-shadow: 0 18px 40px rgba(17,24,39,.16), 0 2px 6px rgba(17,24,39,.08); border-radius: 4px; display: block; }
  .card { background: #fff; border-radius: 14px; box-shadow: 0 24px 60px rgba(17,24,39,.18), 0 2px 8px rgba(17,24,39,.08); overflow: hidden; }
  .cap { position: absolute; font-size: 15px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: .06em; }
  .arrow { position: absolute; font-size: 64px; color: #2b59ff; font-weight: 300; }
  iframe { border: 0; display: block; background: #fff; }
  .left { position: absolute; left: 72px; top: 64px; width: 470px; }
</style>
</head>
<body>
<div class="slide" id="slide"></div>
<script type="module">
const q = new URLSearchParams(location.search);
const slide = q.get('slide') || '1';
const lang = q.get('lang') || 'en';
const W = +(q.get('w') || 1280), H = +(q.get('h') || 800);
document.documentElement.style.setProperty('--w', W + 'px');
document.documentElement.style.setProperty('--h', H + 'px');

const T = {
  en: {
    brand: 'Intelligent label printing',
    h1: 'Print courier labels in <em>one click</em>',
    sub1: 'Crops A4 and A6 label PDFs to the label itself and prints it on your label printer or a plain A4 printer.',
    open: 'Open source (MIT)', noacc: 'No account needed', os: 'macOS & Windows', priv: 'Labels never leave your computer',
    before: 'Your PDF (A4)', after: 'Printed label',
    h2: 'Pick a printer profile. <em>Print.</em>',
    sub2: 'Print the PDF in the current tab, a right-clicked link or a recent download – straight to the printer, no print dialog.',
    h3: 'Paper sizes straight from the <em>printer driver</em>',
    sub3: 'Your own custom sizes, non-printable edges and a profile for every printer. Export the setup to another computer.',
    h4: 'See the result <em>before</em> printing',
    sub4: 'The preview shows what was cropped, the scale and the rotation.',
    h5: 'No label printer? <em>Plain A4 works too.</em>',
    sub5: 'The label is printed in an exact A6 area with cut lines – one per sheet or four at a time.',
    one: '1 label per sheet', four: '4 labels per sheet',
    promoSub: 'Crop & print courier labels in one click',
    promoTag: 'OPEN SOURCE · MACOS & WINDOWS',
    tab: 'label_ORDER-48213.pdf',
  },
  pl: {
    brand: 'Intelligent label printing',
    h1: 'Drukuj etykiety kurierskie <em>jednym kliknięciem</em>',
    sub1: 'Przycina PDF-y A4 i A6 do samej etykiety i drukuje ją na drukarce etykiet albo zwykłej drukarce A4.',
    open: 'Otwarty kod (MIT)', noacc: 'Bez zakładania konta', os: 'macOS i Windows', priv: 'Etykiety nie opuszczają komputera',
    before: 'Twój PDF (A4)', after: 'Wydrukowana etykieta',
    h2: 'Wybierz profil drukarki. <em>Drukuj.</em>',
    sub2: 'PDF z bieżącej karty, z linku pod prawym przyciskiem albo z pobranych – prosto do drukarki, bez okna drukowania.',
    h3: 'Rozmiary papieru prosto ze <em>sterownika drukarki</em>',
    sub3: 'Twoje własne rozmiary, niedrukowalne brzegi i profil dla każdej drukarki. Przenieś ustawienia na inny komputer.',
    h4: 'Zobacz wynik <em>przed</em> wydrukiem',
    sub4: 'Podgląd pokazuje, co zostało wycięte, w jakiej skali i z jakim obrotem.',
    h5: 'Bez drukarki etykiet? <em>Wystarczy zwykłe A4.</em>',
    sub5: 'Etykieta drukuje się w dokładnym polu A6 z liniami cięcia – jedna na arkusz albo cztery naraz.',
    one: '1 etykieta na arkusz', four: '4 etykiety na arkusz',
    promoSub: 'Przycinaj i drukuj etykiety jednym kliknięciem',
    promoTag: 'OTWARTY KOD · MACOS I WINDOWS',
    tab: 'etykieta_ZAM-48213.pdf',
  },
}[lang];

const { processPdf } = await import('/ext/engine.js');
const { newProfile } = await import('/ext/settings.js');
const pdfjs = await import('/ext/lib/pdfjs/pdf.min.mjs');
const src = new Uint8Array(await (await fetch('/sample-a4.pdf')).arrayBuffer());

async function pageCanvas(bytes, pageNo, widthPx) {
  const doc = await pdfjs.getDocument({ data: bytes.slice() }).promise;
  const page = await doc.getPage(pageNo);
  const base = page.getViewport({ scale: 1 });
  const ratio = 2; // crisp on the final image
  const vp = page.getViewport({ scale: (widthPx / base.width) * ratio });
  const c = document.createElement('canvas');
  c.width = vp.width; c.height = vp.height;
  c.style.width = widthPx + 'px'; c.style.height = (vp.height / ratio) + 'px';
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  await page.render({ canvasContext: ctx, viewport: vp, intent: 'print' }).promise;
  c.className = 'paper';
  return c;
}

async function fourUp() {
  // a source PDF with the sample label on four pages -> four labels on one sheet
  const { PDFDocument } = await import('/ext/lib/pdf-lib.esm.min.js');
  const s = await PDFDocument.load(src);
  const d = await PDFDocument.create();
  for (let i = 0; i < 4; i++) d.addPage((await d.copyPages(s, [0]))[0]);
  return new Uint8Array(await d.save());
}

const root = document.getElementById('slide');
const el = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild; };
const brand = `<div class="brand"><img src="/ext/icons/icon128.png">${T.brand}</div>`;
const place = (node, css) => { Object.assign(node.style, { position: 'absolute' }, css); root.append(node); return node; };
const iframeReady = (f) => new Promise((r) => f.addEventListener('load', () => setTimeout(r, 1500), { once: true }));

if (slide === '1') {
  root.append(el(`<div class="left">${brand}<h1>${T.h1}</h1><p class="sub">${T.sub1}</p>
    <div class="badges"><span class="badge hi">✓ ${T.open}</span><span class="badge">${T.noacc}</span><span class="badge">${T.os}</span><span class="badge">🔒 ${T.priv}</span></div></div>`));
  const a4 = await pageCanvas(src, 1, 330);
  place(a4, { left: '600px', top: '150px' });
  place(el(`<div class="cap">${T.before}</div>`), { left: '600px', top: '115px' });
  place(el(`<div class="arrow">→</div>`), { left: '945px', top: '300px' });
  const out = await processPdf(src, newProfile({ paper: 'custom', paperW: 102, paperH: 152, margin: 2 }));
  const a6 = await pageCanvas(out.bytes, 1, 212);
  place(a6, { left: '1010px', top: '210px' });
  place(el(`<div class="cap">${T.after}</div>`), { left: '1010px', top: '175px' });
}

if (slide === '2') {
  root.append(el(`<div class="left">${brand}<h1>${T.h2}</h1><p class="sub">${T.sub2}</p></div>`));
  // browser window with the PDF open, popup on top
  const win = place(el(`<div class="card" style="width:640px;height:600px;background:#2b2d31"></div>`), { left: '580px', top: '120px' });
  win.innerHTML = `<div style="height:44px;background:#f1f3f4;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid #dadce0">
      <span style="width:12px;height:12px;border-radius:50%;background:#ff5f57"></span><span style="width:12px;height:12px;border-radius:50%;background:#febc2e"></span><span style="width:12px;height:12px;border-radius:50%;background:#28c840"></span>
      <span style="margin-left:14px;flex:1;height:28px;border-radius:14px;background:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:13px;color:#555;display:flex;align-items:center;padding:0 12px">example-courier.com/${T.tab}</span>
      <img src="/ext/icons/icon32.png" style="width:20px;height:20px;outline:2px solid #2b59ff;outline-offset:3px;border-radius:4px"></div>`;
  const pdf = await pageCanvas(src, 1, 330);
  pdf.style.position = 'absolute'; pdf.style.left = '40px'; pdf.style.top = '70px'; pdf.style.boxShadow = 'none';
  win.style.position = 'absolute'; win.append(pdf);
  const pop = el(`<div class="card" style="width:360px;height:528px"><iframe src="/popup.html?lang=${lang}" style="width:360px;height:528px"></iframe></div>`);
  place(pop, { left: '812px', top: '132px', transform: 'scale(1.1)', transformOrigin: 'top left' });
  await iframeReady(pop.querySelector('iframe'));
}

if (slide === '3') {
  root.append(el(`<div class="left" style="width:420px">${brand}<h1 style="font-size:44px">${T.h3}</h1><p class="sub">${T.sub3}</p></div>`));
  const card = el(`<div class="card" style="width:1000px;height:935px"><iframe src="/options.html?lang=${lang}" style="width:1000px;height:1800px;margin-top:-6px"></iframe></div>`);
  place(card, { left: '520px', top: '68px', transform: 'scale(0.71)', transformOrigin: 'top left' });
  await iframeReady(card.querySelector('iframe'));
}

if (slide === '4') {
  root.append(el(`<div style="position:absolute;left:72px;top:56px;right:72px">${brand}<h1 style="font-size:42px;margin-top:18px">${T.h4}</h1></div>`));
  const card = el(`<div class="card" style="width:1180px;height:640px"><iframe id="pv" src="/print.html?lang=${lang}" style="width:1180px;height:640px"></iframe></div>`);
  place(card, { left: '50px', top: '205px', transform: 'scale(0.95)', transformOrigin: 'top left' });
  const f = card.querySelector('iframe');
  await iframeReady(f);
  const doc = f.contentDocument;
  const dt = new DataTransfer();
  dt.items.add(new File([src], T.tab, { type: 'application/pdf' }));
  const picker = doc.getElementById('picker');
  picker.files = dt.files;
  picker.dispatchEvent(new Event('change'));
  // the page shows the result in an <iframe> PDF viewer; replace it with a rendered page so it shows in the screenshot
  await new Promise((r) => setTimeout(r, 2500));
  const blobUrl = doc.getElementById('frame').src;
  const outBytes = new Uint8Array(await (await fetch(blobUrl)).arrayBuffer());
  const main = doc.querySelector('main');
  main.style.background = '#525659';
  main.style.display = 'grid'; main.style.placeItems = 'center';
  doc.getElementById('frame').remove();
  const c = await pageCanvas(outBytes, 1, 330);
  main.append(c);
}

if (slide === '5') {
  root.append(el(`<div class="left" style="width:500px">${brand}<h1 style="font-size:46px">${T.h5}</h1><p class="sub">${T.sub5}</p></div>`));
  const one = await processPdf(src, newProfile({ paper: 'A4', perSheet: 1, cutMarks: true }));
  const four = await processPdf(await fourUp(), newProfile({ paper: 'A4', perSheet: 4, cutMarks: true, cropMode: 'auto' }));
  place(await pageCanvas(one.bytes, 1, 300), { left: '620px', top: '165px' });
  place(el(`<div class="cap">${T.one}</div>`), { left: '620px', top: '130px' });
  place(await pageCanvas(four.bytes, 1, 300), { left: '950px', top: '165px' });
  place(el(`<div class="cap">${T.four}</div>`), { left: '950px', top: '130px' });
}

if (slide === 'promo') {
  // 440x280 small promo tile
  document.body.style.background = 'linear-gradient(135deg, #2b59ff 0%, #1d3fd1 100%)';
  root.style.padding = '0';
  const out = await processPdf(src, newProfile({ paper: 'custom', paperW: 102, paperH: 152, margin: 2 }));
  const lab = await pageCanvas(out.bytes, 1, 118);
  place(lab, { left: '296px', top: '58px', transform: 'rotate(6deg)', boxShadow: '0 14px 30px rgba(0,0,0,.35)' });
  place(el(`<div style="color:#fff;width:270px">
    <img src="/ext/icons/icon128.png" style="width:52px;height:52px;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.25)">
    <div style="font-size:25px;font-weight:750;line-height:1.1;margin-top:14px;letter-spacing:-.01em">Intelligent label printing</div>
    <div style="font-size:14.5px;line-height:1.35;margin-top:8px;opacity:.92">${T.promoSub}</div>
    <div style="display:inline-block;margin-top:14px;background:rgba(255,255,255,.18);color:#fff;font-weight:750;font-size:12px;letter-spacing:.06em;padding:6px 11px;border-radius:999px">${T.promoTag}</div>
  </div>`), { left: '28px', top: '30px' });
}

if (slide === 'marquee') {
  // 1400x560 marquee tile
  document.body.style.background = 'linear-gradient(135deg, #2b59ff 0%, #1a35b8 100%)';
  root.style.padding = '0';
  place(el(`<div style="color:#fff;width:640px">
    <div style="display:flex;align-items:center;gap:14px;font-size:22px;font-weight:650"><img src="/ext/icons/icon128.png" style="width:48px;height:48px;border-radius:11px">Intelligent label printing</div>
    <div style="font-size:54px;font-weight:780;line-height:1.06;margin-top:26px;letter-spacing:-.02em">${T.h1.replace(/<\/?em>/g, '')}</div>
    <div style="display:inline-block;margin-top:26px;background:rgba(255,255,255,.18);color:#fff;font-weight:750;font-size:17px;letter-spacing:.06em;padding:9px 16px;border-radius:999px">${T.promoTag}</div>
  </div>`), { left: '80px', top: '96px' });
  const a4 = await pageCanvas(src, 1, 250);
  place(a4, { left: '800px', top: '70px', transform: 'rotate(-4deg)' });
  place(el(`<div class="arrow" style="color:#fff">→</div>`), { left: '1070px', top: '200px' });
  const out = await processPdf(src, newProfile({ paper: 'custom', paperW: 102, paperH: 152, margin: 2 }));
  place(await pageCanvas(out.bytes, 1, 205), { left: '1135px', top: '110px', transform: 'rotate(4deg)' });
}

window.READY = true;
</script>
</body>
</html>
