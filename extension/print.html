<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Label preview – Intelligent label printing</title>
<link rel="icon" href="icons/icon32.png">
<link rel="stylesheet" href="ui.css">
<style>
  body { display: grid; grid-template-columns: 320px 1fr; height: 100vh; }
  aside { padding: 18px; border-right: 1px solid var(--border); overflow: auto; background: var(--panel); }
  aside header { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; }
  aside header img { width: 28px; }
  aside h1 { font-size: 15px; }
  main { position: relative; }
  iframe { width: 100%; height: 100%; border: 0; display: block; background: #525659; }
  .drop { border: 2px dashed var(--border); border-radius: var(--radius); padding: 18px; text-align: center; color: var(--muted); cursor: pointer; margin-bottom: 14px; }
  .drop.over { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
  .btns { display: grid; gap: 8px; margin: 14px 0; }
  .btns .primary { padding: 10px; font-size: 14px; }
  .empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  td, th { text-align: left; padding: 4px 4px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; }
  #file { font-weight: 600; word-break: break-all; margin-bottom: 10px; }
  #status:empty { display: none; }
  @media (max-width: 720px) { body { grid-template-columns: 1fr; grid-template-rows: auto 70vh; height: auto; } }
</style>
</head>
<body>
  <aside>
    <header><img src="icons/icon48.png" alt=""><h1 data-i18n="previewTitle"></h1></header>
    <label class="drop" id="drop"><span data-i18n="dropHere"></span><br><span data-i18n-html="dropOr"></span>
      <input type="file" id="picker" accept="application/pdf,.pdf" hidden>
    </label>
    <div id="file"></div>
    <label class="field"><span data-i18n="printerProfile"></span><select id="profile"></select></label>
    <div class="btns">
      <button class="primary" id="print" disabled data-i18n="printOnProfile"></button>
      <button id="sysprint" disabled data-i18n="printSystem"></button>
      <button id="download" disabled data-i18n="savePdf"></button>
    </div>
    <div id="status" class="status"></div>
    <div id="info"></div>
    <p class="muted" style="margin-top:18px"><a href="options.html" style="color:var(--accent)" data-i18n="profileSettings"></a></p>
  </aside>
  <main>
    <div class="empty" id="empty" data-i18n="noDocument"></div>
    <iframe id="frame" title="PDF preview" hidden></iframe>
  </main>
  <script type="module" src="print.js"></script>
</body>
</html>
